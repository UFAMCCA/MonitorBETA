name: Temperatura da superfície (quinzenal)

on:
  schedule:
    # dias 1 e 16, 12h20 UTC (08h20 em Manaus)
    - cron: "20 12 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  lst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-lst.txt
      - name: Montar mosaico Landsat 8/9
        run: python scripts/lst.py
      - name: Publicar camada
        run: |
          git config user.name "monitor-queimadas[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/lst.png docs/data/lst.json docs/data/lst_grade.npz
          git diff --cached --quiet || git commit -m "Temperatura da superfície: quinzena até $(date +'%d/%m')"
          git pull --rebase --autostash
          git push
