name: Temperatura da superfície (quinzenal)

# Disparado pelo Google Apps Script nos dias 1 e 16, ou manualmente em Actions.
# Cada região roda em paralelo; no fim, as camadas são gravadas juntas.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lst
  cancel-in-progress: false

jobs:
  regioes:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: echo "lista=$(python3 -c 'import sys, json; sys.path.insert(0, "scripts"); import config; print(json.dumps(list(config.REGIOES)))')" >> "$GITHUB_OUTPUT"

  lst:
    needs: regioes
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        regiao: ${{ fromJson(needs.regioes.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-lst.txt
      - name: Montar mosaico Landsat 8/9
        run: python scripts/lst.py --regiao ${{ matrix.regiao }}
      - uses: actions/upload-artifact@v4
        with:
          name: lst-${{ matrix.regiao }}
          path: docs/data/${{ matrix.regiao }}/lst*
          if-no-files-found: ignore
          retention-days: 3

  gravar:
    needs: lst
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: novas
      - name: Gravar as camadas novas
        run: |
          shopt -s nullglob
          for d in novas/lst-*; do
            r="${d#novas/lst-}"
            mkdir -p "docs/data/$r"
            cp "$d"/lst* "docs/data/$r/"
          done
          rm -f docs/data/lst.json docs/data/lst.png docs/data/lst_grade.npz
          git config user.name "monitor-queimadas[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet || git commit -q -m "Temperatura da superfície: quinzena até $(date +'%d/%m')"
          git pull -q --rebase --autostash
          git push -q
