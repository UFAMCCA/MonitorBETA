name: Focos de calor (04h, 12h, 18h de Manaus)

on:
  schedule:
    # Manaus = UTC-4. 04h05, 12h05 e 18h05 locais.
    - cron: "5 8,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar e processar focos
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/focos.py
      - name: Publicar dados
        run: |
          git config user.name "monitor-queimadas[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Focos: atualização $(TZ=America/Manaus date +'%d/%m %Hh')"
          git pull --rebase --autostash
          git push
